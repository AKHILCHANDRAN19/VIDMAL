[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmal"
version = "0.1.0"
description = "Vector Motion Graphics Engine powered by Skia, UHarfBuzz, and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "skia-python",
    "uharfbuzz",
    "freetype-py",
    "fonttools",
    "av",
    "gemini_webapi",
    "pydantic",
    "python-dotenv",
    "numpy",
    "scipy",
    "shapely",
    "kiwisolver",
    "pillow"
]

[project.scripts]
vidmal = "main:run"
