[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmal"
version = "0.1.0"
description = "Vector Motion Graphics Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "skia-python",
    "uharfbuzz",
    "freetype-py",
    "fonttools",
    "av",
    "gemini_webapi",
    "pydantic",
    "python-dotenv",
    "numpy",
    "scipy",
    "shapely",
    "kiwisolver",
    "pillow"
]

[tool.setuptools.packages.find]
include = [
    "config*",
    "renderer*",
    "timeline*",
    "typography*",
    "ai_director*",
    "core_schema*",
    "geometry_engine*"
]

[project.scripts]
vidmal = "main:run"
